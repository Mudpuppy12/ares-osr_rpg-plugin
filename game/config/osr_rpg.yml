---
osr_rpg:
  shortcuts:
    sheet: sheet
  hp_per_level: max
  apply_prime_xp_bonus: true
  require_server_rolls: true
  allowed_classes: []
  osr_rpg_blurb: |
    Create your OSR character sheet. Pick a class (race-as-class), set ability scores
    (3d6 each), alignment, and skill expertise points if applicable.
  spells_blurb: |
    OSE Advanced Fantasy spell lists by tradition. Click a spell for its description.
  equipment_blurb: |
    OSE Advanced Fantasy equipment reference. AC uses ascending armor class (lower is better).
    Shield improves AC by 1. Starting gold is typically 3d6×10 gp.
  public_sheets: true
  permissions:
    manage_osr_rpg_xp: Award OSR XP and level other characters.
    manage_osr_rpg: Manage OSR HP, combat, and spell actions for others.
  default_ac: 9
